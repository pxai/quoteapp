services:
  frontend:
    image: node:24-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://localhost:8080
  api:
    build: ./backend
    ports: ["8080:8080"]
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
    command: npm run dev
    environment:
      - POSTGRES_DSN=postgres://postgres:postgres@postgres:5432/db?sslmode=disable
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    ports: ["5432:5432"]
    volumes:
      - ./seed/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  k6:
    image: grafana/k6:latest
    profiles: ["load"]
    environment:
      - BASE_URL=http://api:8080
    volumes:
      - ./load:/scripts
    working_dir: /scripts
    command: ["run", "05-inventory-concurrency.js"]

volumes:
  api_node_modules:
