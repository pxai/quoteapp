name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Start API with test database
        env:
          POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/test?sslmode=disable
          CORS_ORIGIN: http://127.0.0.1:5173
        run: docker compose -f ../docker-compose.yml up --build -d --wait api
      - name: Run lint, unit, and E2E tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Stop test services
        if: always()
        run: docker compose -f ../docker-compose.yml down
